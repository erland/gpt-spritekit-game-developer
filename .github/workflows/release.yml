name: Release GPT distributions
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Build and validate
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/build_distributions.py --project-root . --version "$VERSION"
          python scripts/validate_distributions.py --project-root .
      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
