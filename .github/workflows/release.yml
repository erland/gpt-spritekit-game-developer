name: Release GPT distributions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install PyYAML
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must be vMAJOR.MINOR.PATCH, got: $GITHUB_REF_NAME" >&2
            exit 1
          }
      - name: Build and validate
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/build_distributions.py --project-root . --version "$VERSION"
          python scripts/validate_distributions.py --project-root .
      - name: Verify release package set and checksums
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          project = "spritekit-game-developer"
          suffixes = ("project", "chat", "plugin", "claude-project", "claude-skills", "opencode")
          expected = {f"{project}-{suffix}-{version}.zip" for suffix in suffixes}
          actual = {path.name for path in Path(".").glob("*.zip")}
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing release archives: {sorted(missing)}")
          manifest = json.loads(Path("DELIVERY-MANIFEST.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              raise SystemExit("Delivery manifest has incorrect release version")
          manifest_files = {item["file"] for item in manifest.get("artifacts", [])}
          if not expected.issubset(manifest_files):
              raise SystemExit("Delivery manifest omits required archives")
          print(f"Verified {len(expected)} required archives; {len(actual)} ZIP files total.")
          PY
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json --clobber
