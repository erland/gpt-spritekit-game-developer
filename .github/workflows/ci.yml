name: Validate GPT distributions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Build peer distributions
        run: python scripts/build_distributions.py --project-root . --version "$(cat VERSION)"
      - name: Validate archives
        run: python scripts/validate_distributions.py --project-root .
