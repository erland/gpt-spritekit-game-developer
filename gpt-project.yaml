schema_version: 1
project:
  id: spritekit-game-developer
  name: SpriteKit Game Designer & Developer
  language: sv
  description: Apple TV SpriteKit game design and development assistant
structure:
  canonical_root: src
  instructions:
    path: canonical
    required: true
  conversation_starters:
    path: config
    required: true
  runtime_policy:
    path: canonical
    required: false
  knowledge:
    path: knowledge
    required: false
  templates:
    path: templates
    required: false
  schemas:
    path: schemas
    required: false
  scripts:
    path: scripts
    required: false
  tests:
    path: tests
    required: false
  evals:
    path: evals
    required: false
  research:
    path: research
    required: false
  build:
    path: build
    generated: true
    create_when_needed: true
  dist:
    path: dist
    generated: true
    create_when_needed: true
runtime:
  primary: none
  chat_zip:
    enabled: true
    bundle_distribution_engine: true
    role: peer_distribution
    allow_richer_runtime_than_custom_gpt: true
    entrypoint: START-HERE.md
    schema: schemas/chat-zip-runtime.schema.json
    start_here_template: templates/START-HERE.chat.md.tpl
    layout:
      assistant: assistant
      knowledge: knowledge
      schemas: schemas
      scripts: scripts
      templates: templates
      runtime: runtime
    include:
      instructions:
      - src/instructions/system.md
      policies:
      - src/runtime-policy/*.md
      conversation_starters:
      - src/conversation-starters/**
      knowledge:
      - knowledge/**
      schemas:
      - schemas/**
      scripts:
      - scripts/**
      templates:
      - templates/**
    exclude:
    - docs/**
    - tests/**
    - evals/**
    - research/**
    - .github/**
    - .git/**
    - build/**
    - dist/**
    - project-status.yaml
    - PROJECT.md
    - STATUS.md
    manifest:
      required: true
      checksums: true
    deterministic_build: true
    omit_empty_runtime_directories: true
  claude:
    enabled: true
    role: peer_distribution
    mode: claude_project
    schema: schemas/claude-portable-runtime.schema.json
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      runtime_contract: project/runtime-contract.json
    templates:
      readme: templates/README.claude.md.tpl
    validation:
      require_instructions: true
      require_runtime_contract: true
  opencode:
    enabled: true
    role: peer_distribution
    mode: opencode_workspace
    schema: schemas/opencode-runtime.schema.json
    layout:
      instructions: AGENTS.md
      config: opencode.json
      tools: .opencode/tools
      runtime_scripts: scripts
      runtime_contract: .opencode/runtime-contract.json
      knowledge: knowledge
    templates:
      readme: templates/README.opencode.md.tpl
    skills:
      enabled: true
      directory: .opencode/skills
      definitions:
      - id: gpt-project-workflow
        name: gpt-project-workflow
        description: Planera, återuppta och fortsätt ett GPT Byggaren-projekt utifrån
          faktisk projektstatus.
        references:
        - docs/dynamic-planning.md
        - docs/resume-flow.md
        - docs/next-step-recommendation.md
    validation:
      require_agents_md: true
      require_runtime_contract: true
  plugin:
    enabled: true
    role: peer_distribution
    mode: openai_plugin
    schema: schemas/plugin-runtime.schema.json
    layout:
      manifest_file: plugin.json
      skills: skills
      references: references
      assets: assets
      scripts: scripts
    templates:
      readme: templates/README.plugin.md.tpl
    validation:
      require_manifest: true
      require_skill: true
      require_skill_frontmatter: true
  custom_gpt:
    enabled: false
    role: peer_distribution
    compilation_mode: adaptive
    allow_reduced_functionality: true
    platform_limits:
      instruction_max_characters: 8000
      knowledge_max_files: 20
    notes:
    - Platform limits are configuration values and must be easy to update.
    - Custom GPT and Chat ZIP are peer distribution targets derived from the same
      canonical contract.
    schema: schemas/custom-gpt-compilation.schema.json
    instruction:
      mode: compressed
      max_characters: 8000
    knowledge:
      strategy: hybrid
      max_files: 20
    builder:
      instructions: builder/instructions.md
      conversation_starters: builder/conversation-starters.md
      capabilities: builder/capabilities.md
      runtime_contract: builder/runtime-contract.json
      knowledge_package: builder/knowledge-package
    templates:
      readme: templates/README.custom-gpt.md.tpl
      compatibility: templates/COMPATIBILITY.md.tpl
      capabilities: templates/capabilities.md.tpl
    compatibility:
      report_required: true
      parity_symbols:
        equivalent: ✓
        reduced: '~'
        missing: '-'
    validation:
      block_on_instruction_limit: true
      block_on_knowledge_limit: true
      block_on_misleading_core_functionality: true
skills:
  contract_version: 1
  mode: explicit
  definitions:
  - id: spritekit-game-development
    name: SpriteKit Game Development
    description: Design, build, test and package SpriteKit games for Apple TV/tvOS
      and macOS.
    source: canonical/skills/spritekit-game-development/behavior.md
    references:
    - knowledge/01-GPT-ROLE-AND-PRINCIPLES.md
    - knowledge/02-GAME-DESIGN-FOUNDATIONS.md
    - knowledge/03-INSPIRATION-AND-DIFFERENTIATION.md
    - knowledge/04-TVOS-SPRITEKIT-ARCHITECTURE.md
    - knowledge/05-CONTROLLER-AND-TV-UX.md
    - knowledge/06-PROJECT-ZIP-WORKFLOW.md
    - knowledge/07-TESTING-AND-RELEASE.md
    - knowledge/08-GAME-ASSET-REQUIREMENTS-AND-INTEGRATION.md
    - knowledge/09-GENRE-PLATFORMER.md
    - knowledge/10-GENRE-SHOOT-EM-UP.md
    - knowledge/11-GENRE-TURN-BASED-STRATEGY.md
    - knowledge/12-GENRE-TOP-DOWN-ACTION.md
    - knowledge/13-GENRE-ISOMETRIC-ADVENTURE.md
    - knowledge/14-GENRE-PUZZLE.md
    - knowledge/15-GENRE-LOCAL-MULTIPLAYER.md
    - knowledge/16-VERSION-CONTROL-AND-CI.md
    assets: []
    scripts: []
  schema: schemas/skill-contract.schema.json
  resource_policy: explicit
capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  recommendation_mode: inferred_from_use_case
  ask_user_only_when_business_choice_is_ambiguous: true
  requirements:
    web:
      level: recommended
    filesystem:
      read: required
      write: required
    shell:
      level: optional
    code_execution:
      level: required
    structured_data:
      level: required
    persistent_state:
      level: recommended
    external_tools:
      level: optional
      preferred_protocols:
      - mcp
    image_generation:
      level: optional
  legacy_mapping:
    web: web
    data_analysis: code_execution
    file_handling: filesystem
    image_generation: image_generation
    structured_knowledge: structured_data
tools:
  contract_version: 1
  tools: []
release:
  github:
    enabled: false
  local:
    enabled: true
artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    development_plan:
      kind: document
      format: markdown
      requirement: required
      persistence: persistent
      multiplicity: one
      description: Stegvis utvecklingsplan som kan återanvändas mellan runtimes.
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one
      filename_pattern: <project-id>-project.zip
      description: Komplett utvecklingsprojekt för fortsatt arbete och migrering.
    runtime_package:
      kind: distribution
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: many
      description: En eller flera runtime-specifika distributioner byggda från samma
        canonical projekt.
    validation_report:
      kind: report
      format: structured
      requirement: required
      persistence: persistent
      multiplicity: one
    parity_report:
      kind: report
      format: markdown
      requirement: conditional
      condition: multiple_runtimes
      persistence: persistent
      multiplicity: one
    checksums:
      kind: metadata
      format: sha256
      requirement: required
      persistence: persistent
      multiplicity: one
  legacy_mapping:
    project_zip: project_package
    chat_zip: runtime_package
    custom_gpt_zip: runtime_package
    claude_project_zip: runtime_package
    claude_skills_zip: runtime_package
    opencode_zip: runtime_package
    plugin_zip: runtime_package
    validation_report: validation_report
    parity_report: parity_report
    checksums: checksums
workspace_state:
  contract_version: 1
  workspace:
    requirement: optional
    persistence: preferred
    portable: true
    separate_from_assistant: true
  state:
    requirement: optional
    persistence: preferred
    authority: workspace_file
    conversation_fallback: true
    format: yaml
    path: project-status.yaml
  runtime_preferences:
    chat: conversation_or_file
    agent: runtime_managed
instructions:
  architecture: docs/instruction-architecture.md
  schema: schemas/instruction-architecture.schema.json
  mode: modular_skills
  canonical: canonical/core.md
  core: canonical/core.md
  policies:
    include: []
  compilation:
    chat:
      mode: full
    custom_gpt:
      mode: compressed
      max_characters_from: runtime.custom_gpt.platform_limits.instruction_max_characters
  single_source_of_truth: true
  distribution_specific_instructions_are_generated: true
knowledge_architecture:
  canonical_root: knowledge
build_system:
  build_script: scripts/build_distributions.py
  validation_script: scripts/validate_distributions.py
  targets:
  - project
  - chat
  - claude_project
  - claude_skills
  - opencode
  - plugin
  runtime_targets:
    chat:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: <project-id>-chat-<version>.zip
    claude_project:
      runtime_id: claude_project
      runtime_key: claude
      builder: claude
      artifact_type: claude_project_zip
      filename_pattern: <project-id>-claude-project-<version>.zip
    claude_skills:
      runtime_id: claude_skills
      runtime_key: claude
      builder: claude_skills
      artifact_type: claude_skills_zip
      filename_pattern: <project-id>-claude-skills-<version>.zip
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: <project-id>-opencode-<version>.zip
    plugin:
      runtime_id: openai_plugin
      runtime_key: plugin
      builder: plugin
      artifact_type: plugin_zip
      filename_pattern: <project-id>-plugin-<version>.zip
  output_root: dist
  working_root: build
  deterministic_zip: true
  manifest: true
  checksums: sha256
  project_zip_excludes:
  - build/**
  - dist/**
  - .git/**
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
